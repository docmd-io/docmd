<body class="mode-split">

    <!-- Top Bar -->
    <div class="top-bar">
        <div class="logo">
            <a href="https://docmd.io" class="docmd-logo" title="Back to docmd.io" aria-label="Back to docmd.io"><svg width="24" height="24" id="icon-feather" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20.24 12.24a6 6 0 0 0-8.49-8.49L5 10.5V19h8.5z"></path><line x1="16" y1="8" x2="2" y2="22"></line><line x1="17.5" y1="15" x2="9" y2="15"></line></svg></a> docmd <span>Live</span>
        </div>

        <!-- Unified 3-Way Switcher -->
        <div class="view-switcher desktop-only">
            <button class="view-btn active" onclick="setMode('split')" data-mode="split">Split</button>
            <button class="view-btn" onclick="setMode('editor')" data-mode="editor">Editor</button>
            <button class="view-btn" onclick="setMode('preview')" data-mode="preview">Preview</button>
        </div>
    </div>

    <!-- Workspace -->
    <div class="workspace" id="workspace">
        <!-- Editor -->
        <div class="pane editor-pane" id="editorPane">
            <div class="pane-header">
                <span>Markdown</span>
                <div class="presets-bar">
                    <button class="active" data-preset="basics" onclick="loadPreset('basics', this)">Basics</button>
                    <button data-preset="containers" onclick="loadPreset('containers', this)">Callouts & Cards</button>
                    <button data-preset="tabs" onclick="loadPreset('tabs', this)">Tabs</button>
                    <button data-preset="steps" onclick="loadPreset('steps', this)">Steps</button>
                    <button data-preset="mermaid" onclick="loadPreset('mermaid', this)">Diagrams</button>
                    <button data-preset="math" onclick="loadPreset('math', this)">Math</button>
                    <button data-preset="playground" onclick="loadPreset('playground', this)">Playground</button>
                </div>
            </div>
            <div class="editor-container">
                <pre class="editor-highlight" id="highlightBg" aria-hidden="true"><code id="highlightCode"></code></pre>
                <textarea id="input" spellcheck="false"></textarea>
                <button id="copyBtn" class="copy-markdown-btn" type="button" title="Copy Markdown">Copy</button>
            </div>
        </div>

        <!-- Resizer Handle -->
        <div class="resizer" id="resizer"></div>

        <!-- Preview -->
        <div class="pane preview-pane" id="previewPane">
            <div class="pane-header">
                <span>Preview</span>
                <button class="preview-theme-toggle" id="previewThemeToggle" type="button" aria-label="Toggle preview theme" title="Toggle light/dark">
                    <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"></circle><path d="M12 2v2"></path><path d="M12 20v2"></path><path d="m4.93 4.93 1.41 1.41"></path><path d="m17.66 17.66 1.41 1.41"></path><path d="M2 12h2"></path><path d="M20 12h2"></path><path d="m6.34 17.66-1.41 1.41"></path><path d="m19.07 4.93-1.41 1.41"></path></svg>
                    <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path></svg>
                </button>
            </div>
            <iframe id="preview"></iframe>
        </div>
    </div>

    <!-- Mobile Bottom Tabs (Keep for small screens) -->
    <div class="mobile-tabs">
        <button class="mobile-tab-btn active" onclick="setMode('editor')" id="mob-edit">Editor</button>
        <button class="mobile-tab-btn" onclick="setMode('preview')" id="mob-prev">Preview</button>
    </div>

    <script>
        const SNIPPETS = {};

        const input = document.getElementById('input');
        const preview = document.getElementById('preview');
        const highlightBg = document.getElementById('highlightBg');
        const highlightCode = document.getElementById('highlightCode');

        function updateEditorHighlight() {
            if (window.docmd && typeof window.docmd.highlight === 'function') {
                const text = input.value || '';
                const res = docmd.highlight(text);
                highlightCode.innerHTML = res.value + (text.endsWith('\n') ? '\n' : '');
            } else {
                highlightCode.textContent = (input.value || '') + (input.value.endsWith('\n') ? '\n' : '');
            }
        }

        input.addEventListener('scroll', () => {
            highlightBg.scrollTop = input.scrollTop;
            highlightBg.scrollLeft = input.scrollLeft;
        });

        const PRESET_METADATA = {
            basics: { title: 'Basics', desc: 'The zero-config documentation engine' },
            containers: { title: 'Callouts & Cards', desc: 'Interactive callouts, cards, and buttons' },
            tabs: { title: 'Tabs', desc: 'Tabbed interfaces for code and languages' },
            steps: { title: 'Steps', desc: 'Sequential walkthroughs and numbered steps' },
            mermaid: { title: 'Diagrams', desc: 'Flowcharts and diagrams with Mermaid.js' },
            math: { title: 'KaTeX Math', desc: 'Scientific math typesetting with KaTeX' },
            playground: { title: 'Interactive Playground', desc: 'Interactive live code runner and component sandbox' }
        };

        function getPresetFromUrl() {
            const path = window.location.pathname.replace(/^\/+|\/+$/g, '');
            const segments = path.split('/');
            const last = segments[segments.length - 1];
            if (last && SNIPPETS[last]) return last;
            const hash = window.location.hash.replace(/^#\/?/, '').trim();
            if (hash && SNIPPETS[hash]) return hash;
            return null;
        }

        function updatePageMetadata(key) {
            const meta = PRESET_METADATA[key] || { title: key.charAt(0).toUpperCase() + key.slice(1), desc: 'docmd Live Editor' };
            const pageTitle = `docmd Live Editor — ${meta.title}`;
            document.title = pageTitle;
            const canonicalPath = key === 'basics' ? '' : `${key}/`;
            const canonicalUrl = `https://live.docmd.io/${canonicalPath}`;

            const canonical = document.querySelector('link[rel="canonical"]');
            if (canonical) canonical.setAttribute('href', canonicalUrl);

            const descEl = document.querySelector('meta[name="description"]');
            if (descEl && meta.desc) descEl.setAttribute('content', meta.desc);

            const ogTitle = document.querySelector('meta[property="og:title"]');
            if (ogTitle) ogTitle.setAttribute('content', pageTitle);

            const ogDesc = document.querySelector('meta[property="og:description"]');
            if (ogDesc && meta.desc) ogDesc.setAttribute('content', meta.desc);

            const ogUrl = document.querySelector('meta[property="og:url"]');
            if (ogUrl) ogUrl.setAttribute('content', canonicalUrl);

            const twTitle = document.querySelector('meta[name="twitter:title"]');
            if (twTitle) twTitle.setAttribute('content', pageTitle);

            const twDesc = document.querySelector('meta[name="twitter:description"]');
            if (twDesc && meta.desc) twDesc.setAttribute('content', meta.desc);
        }

        function loadPreset(key, btn, updateUrl = true) {
            if (SNIPPETS[key]) {
                input.value = SNIPPETS[key];
                updateEditorHighlight();
                document.querySelectorAll('.presets-bar button').forEach(b => {
                    b.classList.toggle('active', b.getAttribute('data-preset') === key);
                });
                if (updateUrl) {
                    const targetPath = key === 'basics' ? '/' : `/${key}`;
                    if (window.location.pathname !== targetPath && window.location.pathname !== `/${key}/`) {
                        history.pushState({ preset: key }, '', targetPath);
                    }
                    updatePageMetadata(key);
                }
                render();
            }
        }

        window.addEventListener('popstate', (e) => {
            const key = e.state?.preset || getPresetFromUrl() || 'basics';
            loadPreset(key, null, false);
        });

        // Initialize with URL preset or Basics
        const initialPreset = getPresetFromUrl() || 'basics';
        if (!input.value || input.value === SNIPPETS.basics) {
            input.value = SNIPPETS[initialPreset] || SNIPPETS.basics;
        }
        document.querySelectorAll('.presets-bar button').forEach(b => {
            b.classList.toggle('active', b.getAttribute('data-preset') === initialPreset);
        });
        updatePageMetadata(initialPreset);
        updateEditorHighlight();

        let currentRenderId = 0;

        async function render() {
            const renderId = ++currentRenderId;
            try {
                const scrollY = preview.contentWindow ? preview.contentWindow.scrollY : 0;

                let html = await docmd.compile(input.value, {
                    siteTitle: 'Live Preview',
                    search: false,
                    theme: { name: 'default', appearance: 'light' },
                    sidebar: { collapsible: false }
                });

                // Prevent older renders from overwriting newer ones
                if (renderId !== currentRenderId) return;

                html = html.replace('<head>', '<head><base target="_blank">');

                const scrollScript = `
                    <script>
                        if (window) window.scrollTo(0, ${scrollY});
                    <\/script>
                `;
                html = html.replace('</body>', `${scrollScript}</body>`);

                if ('srcdoc' in preview) {
                    preview.srcdoc = html;
                } else if (preview.contentWindow && preview.contentWindow.document) {
                    const doc = preview.contentWindow.document;
                    doc.open();
                    doc.write(html);
                    doc.close();
                }
            } catch (e) { console.error(e); }
        }

        let timer;
        input.addEventListener('input', () => {
            updateEditorHighlight();
            clearTimeout(timer);
            timer = setTimeout(render, 300);
        });

        // Copy Markdown Button Handler
        const copyBtn = document.getElementById('copyBtn');
        if (copyBtn) {
            copyBtn.addEventListener('click', async () => {
                try {
                    await navigator.clipboard.writeText(input.value);
                    copyBtn.textContent = 'Copied !';
                    copyBtn.classList.add('copied');
                    setTimeout(() => {
                        copyBtn.textContent = 'Copy';
                        copyBtn.classList.remove('copied');
                    }, 2000);
                } catch (err) {
                    console.error('Failed to copy markdown:', err);
                }
            });
        }

        // Auto Scroll Sync (textarea -> iframe preview) - Disabled by default
        const ENABLE_SCROLL_SYNC = false;
        let isSyncingInputScroll = false;
        input.addEventListener('scroll', () => {
            if (!ENABLE_SCROLL_SYNC || isSyncingInputScroll) return;
            isSyncingInputScroll = true;
            const maxInputScroll = input.scrollHeight - input.clientHeight;
            if (maxInputScroll > 0 && preview.contentWindow && preview.contentWindow.document) {
                const ratio = input.scrollTop / maxInputScroll;
                const win = preview.contentWindow;
                const doc = win.document.documentElement;
                const maxPreviewScroll = doc.scrollHeight - win.innerHeight;
                if (maxPreviewScroll > 0) {
                    win.scrollTo({ top: ratio * maxPreviewScroll, behavior: 'instant' });
                }
            }
            requestAnimationFrame(() => { isSyncingInputScroll = false; });
        });

        // Preview pane: light/dark toggle. Mutates the iframe's
        // document data-theme and persists via 'docmd-live-theme'
        // so it defaults to light unless the user manually chose dark.
        const previewThemeToggle = document.getElementById('previewThemeToggle');
        if (previewThemeToggle) {
          try {
            if (localStorage.getItem('docmd-live-theme') === 'dark') {
              document.documentElement.setAttribute('data-theme', 'dark');
            }
          } catch (e) {}

          previewThemeToggle.addEventListener('click', () => {
            const doc = preview.contentWindow && preview.contentWindow.document;
            if (!doc) return;
            const html = doc.documentElement;
            const current = html.getAttribute('data-theme') === 'dark' ? 'dark' : 'light';
            const next = current === 'dark' ? 'light' : 'dark';
            html.setAttribute('data-theme', next);
            document.documentElement.setAttribute('data-theme', next);
            try { localStorage.setItem('docmd-live-theme', next); } catch (e) {}
          });
        }

        render();

        const resizer = document.getElementById('resizer');
        const editorPane = document.getElementById('editorPane');
        const workspace = document.getElementById('workspace');
        let isResizing = false;

        resizer.addEventListener('mousedown', (e) => {
            isResizing = true;
            resizer.classList.add('resizing');
            preview.style.pointerEvents = 'none';
            document.body.style.cursor = 'col-resize';
        });

        document.addEventListener('mousemove', (e) => {
            if (!isResizing) return;
            const containerWidth = workspace.offsetWidth;
            const newEditorWidth = (e.clientX / containerWidth) * 100;
            if (newEditorWidth > 15 && newEditorWidth < 85) {
                editorPane.style.width = newEditorWidth + '%';
            }
        });

        document.addEventListener('mouseup', () => {
            if (isResizing) {
                isResizing = false;
                resizer.classList.remove('resizing');
                preview.style.pointerEvents = 'auto';
                document.body.style.cursor = 'default';
            }
        });

        function setMode(mode) {
            document.querySelectorAll('.view-switcher .view-btn').forEach(btn => {
                btn.classList.toggle('active', btn.dataset.mode === mode);
            });
            const mobMode = mode === 'split' ? 'editor' : mode;
            document.getElementById('mob-edit').classList.toggle('active', mobMode === 'editor');
            document.getElementById('mob-prev').classList.toggle('active', mobMode === 'preview');

            document.body.classList.remove('mode-split', 'mode-single', 'show-editor', 'show-preview');

            if (mode === 'split') {
                document.body.classList.add('mode-split');
            } else {
                document.body.classList.add('mode-single');
                document.body.classList.add('show-' + mode);
            }
        }
    </script>
</body>
</html>
